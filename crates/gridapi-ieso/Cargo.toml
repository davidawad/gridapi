[package]
name = "gridapi-ieso"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "GPL-3.0-or-later"
description = "Async Rust client for the IESO (Ontario) public reports site: LMP and zonal prices, demand, generation by fuel, interties and adequacy."
readme = "README.md"
keywords = ["ieso", "ontario", "electricity", "lmp", "energy"]
categories = ["api-bindings", "science"]
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
csv = "1"
quick-xml = { version = "0.38.4", features = ["serialize", "overlapped-lists"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["time"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
dbg_macro = "warn"
todo = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
